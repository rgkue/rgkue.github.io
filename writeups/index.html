<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writeups - Isaac Muñoz</title>
  <meta name="description" content="Writeups de CTF y pentesting - Isaac Muñoz (rgkue)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/icon.png" />
  <link rel="stylesheet" href="writeups.css" />
</head>
<body>

  <script src="../nav.js"></script>

  <div class="shell">

    <!-- ══ SIDEBAR IZQUIERDA: perfil + búsqueda + filtros ═══════ -->
    <aside class="sidebar-left">

      <div class="profile">
        <img
          class="avatar"
          src="../assets/icon.png"
          alt="Isaac Muñoz"
          width="52" height="52"
        />
        <div class="profile-text">
          <span class="profile-name">Isaac Muñoz</span>
          <span class="profile-handle mono">rgkue</span>
        </div>
      </div>
      <p class="profile-bio">Documentación de máquinas y retos que hago en plataformas de ciberseguridad. Algunas son completamente redactadas por IA, sorry.</p>

      <label class="search-wrap" for="search-input">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Buscar writeups..." autocomplete="off" />
      </label>

      <div class="filters-block">
        <div class="filters-title">
          Filtros
          <button id="reset-btn" class="filters-clear">Limpiar</button>
        </div>

        <div class="accordion" data-acc="plataforma">
          <button class="accordion-head">
            <span>Plataforma</span>
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-body" id="platform-list"></div>
        </div>

        <div class="accordion" data-acc="dificultad">
          <button class="accordion-head">
            <span>Dificultad</span>
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-body" id="diff-list"></div>
        </div>
      </div>

    </aside>

    <!-- ══ FEED / GRID CENTRAL ═══════════════════════════════════ -->
    <main class="feed">

      <div class="feed-header">
        <span class="feed-title">Writeups</span>
        <span class="feed-count mono" id="feed-count"></span>
      </div>

      <div id="writeups-feed"></div>

    </main>

    <!-- ══ PANEL DERECHO: timeline ═══════════════════════════════ -->
    <aside class="sidebar-right">
      <div class="panel-section">
        <p class="sidebar-label">Total</p>
        <div class="stat-row">
          <span id="count-total" class="stat-num mono">0</span>
          <span class="stat-label">writeups</span>
        </div>
      </div>

      <div class="panel-section panel-timeline">
        <p class="sidebar-label">Timeline</p>
        <div id="timeline" class="timeline"></div>
      </div>
    </aside>

  </div>

  <script src="writeups-data.js"></script>
  <script src="writeups.js"></script>
</body>
</html>
