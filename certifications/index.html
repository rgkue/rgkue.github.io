<!DOCTYPE html>
<html lang="es">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HTC1Y1F39M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-HTC1Y1F39M');
</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isaac Muñoz - Certificaciones</title>
  <meta name="description" content="Cursos, insignias y certificaciones de Isaac Muñoz (rgkue)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../assets/icon.png" />
  <link rel="stylesheet" href="certifications.css" />
</head>

<body>

  <script src="../nav.js"></script>

  <div class="shell">

    <!-- ══ SIDEBAR IZQUIERDA: perfil + búsqueda + filtros ═══════ -->
    <aside class="sidebar-left">

      <div class="profile">
        <img class="avatar" src="../assets/photo.jpg" alt="Isaac Muñoz" width="52" height="52" />
        <div class="profile-text">
          <span class="profile-name">Isaac Muñoz</span>
          <span class="profile-handle mono">rgkue</span>
        </div>
      </div>
      <p class="profile-bio">Cursos, insignias y certificaciones que he completado en diversas plataformas como Cisco, AWS y otras :D</p>

      <label class="search-wrap" for="search-input">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Buscar certificaciones..." autocomplete="off" />
      </label>

      <div class="filters-block">
        <div class="filters-title">
          Filtros
          <button id="reset-btn" class="filters-clear">Limpiar</button>
        </div>

        <div class="accordion" data-acc="emisor">
          <button class="accordion-head">
            <span>Emisor</span>
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-body" id="issuer-list"></div>
        </div>
      </div>

    </aside>

    <!-- ══ FEED / GRID CENTRAL ═══════════════════════════════════ -->
    <main class="feed">

      <div class="feed-header">
        <span class="feed-title">Certificaciones</span>
        <span class="feed-count mono" id="feed-count"></span>
      </div>

      <div id="certs-feed"></div>

    </main>

    <!-- ══ PANEL DERECHA: total + timeline ═══════════════════════ -->
    <aside class="sidebar-right">
      <div class="panel-section">
        <p class="sidebar-label">Total</p>
        <div class="stat-row">
          <span id="count-total" class="stat-num mono">0</span>
          <span class="stat-label">certificaciones</span>
        </div>
      </div>

      <div class="panel-section panel-timeline">
        <p class="sidebar-label">Timeline</p>
        <div id="timeline" class="timeline"></div>
      </div>
    </aside>

  </div>

  <!-- ══ VISOR DE CERTIFICADO — lightbox a pantalla completa ═══ -->
  <div class="cert-viewer-overlay" id="cert-viewer-overlay">
    <div class="cert-viewer-box">
      <img class="cert-viewer-img" id="cert-viewer-img" src="" alt="" />
      <button class="cert-viewer-close" id="cert-viewer-close" type="button" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <script src="certifications-data.js"></script>
  <script src="certifications.js"></script>
</body>
</html>
