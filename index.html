<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isaac Muñoz - Portafolio</title>
  <meta name="description" content="Portafolio de Isaac Muñoz (rgkue) — Estudiante de Ciberseguridad, UTP Panamá." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="stars-canvas"></canvas>

<!-- ══════════════════════════════════════════
     HERO
══════════════════════════════════════════ -->
<section id="hero">
  <div id="hero-photo" class="hero-photo-placeholder">👤</div>
  <h1 id="hero-name" class="hero-name"></h1>
  <div id="hero-alias" class="hero-alias mono"></div>
  <div id="hero-tagline" class="hero-tagline mono"></div>
  <div id="hero-socials" class="hero-socials"></div>
  <div class="scroll-hint">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>
</section>

<!-- ══════════════════════════════════════════
     TECNOLOGÍAS — Carrusel
══════════════════════════════════════════ -->
<section id="tools">
  <p class="section-label"><span>Tecnologías &amp; Herramientas</span></p>
  <div class="carousel-track-wrap">
    <div id="carousel-track" class="carousel-track"></div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     PROYECTOS
══════════════════════════════════════════ -->
<section id="projects">
  <p class="section-label"><span>Proyectos &amp; Categorías</span></p>
  <div class="container">
    <div id="projects-list"></div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     SERVICIOS
     Para activar: rellena PORTFOLIO.services en data.js
══════════════════════════════════════════ -->
<section id="services">
  <p class="section-label"><span>Servicios</span></p>
  <div class="container">
    <div id="services-content"></div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     BLOG — Últimas entradas
══════════════════════════════════════════ -->
<section id="blog">
  <p class="section-label"><span>Blog</span></p>
  <div class="container">
    <div id="blog-preview-grid" class="blog-preview-grid"></div>
    <div class="blog-cta">
      <a href="blog/index.html" class="btn-blog-all">
        Ver todos los posts
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     HABILIDADES & CV
══════════════════════════════════════════ -->
<section id="skills">
  <p class="section-label"><span>Habilidades &amp; Experiencia</span></p>
  <div class="container">

    <!-- CV downloadable -->
    <div class="cv-card fade-up">
      <div class="cv-icon">📄</div>
      <div class="cv-title">Hoja de Vida</div>
      <div class="cv-sub">Estudiante de Ciberseguridad — Universidad Tecnológica de Panamá</div>
      <a id="cv-link" href="assets/cv.pdf" target="_blank" class="btn-cv">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Descargar CV (PDF)
      </a>
    </div>

    <!-- Tarjetas de habilidades (generadas desde data.js) -->
    <div id="skills-grid" class="skills-grid"></div>

  </div>
</section>

<!-- ══════════════════════════════════════════
     EDUCACIÓN
══════════════════════════════════════════ -->
<section id="education">
  <div class="container">
    <p class="section-sub mono">Educación</p> 
    <div id="education-list"></div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     EXPERIENCIA PROFESIONAL
══════════════════════════════════════════ -->
<section id="experience">
  <div class="container">
    <p class="section-sub mono">Experiencia Profesional</p>
    <div id="experience-list"></div>
  </div>
</section>

<!-- ══════════════════════════════════════════
     FOOTER
══════════════════════════════════════════ -->
<footer>
  <div id="footer-social" class="footer-social"></div>
  <div id="footer-emails" class="footer-emails"></div>
  <div id="footer-copy"   class="footer-copy mono"></div>
</footer>

<!-- data primero, luego lógica -->
<script src="data.js"></script>
<script src="blog/data.js"></script>
<script src="main.js"></script>
</body>
</html>
